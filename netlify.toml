[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # resvg (rendu PNG des graphiques du rapport) = module natif : non bundlé par esbuild
  external_node_modules = ["@resvg/resvg-js", "@resvg/resvg-js-linux-x64-gnu"]

[functions."daily-report"]
  # MAIL DU SOIR EN SOMMEIL (10 oct. 2026) — remplacé par l'onglet « Coach » du P.P.L.
  # Code conservé ; envoi manuel toujours possible via report-send-background.
  # schedule = "0 19,20 * * *"
  included_files = ["node_modules/@resvg/resvg-js-linux-x64-gnu/**"]

[functions."report-build-cron"]
  # Génère le rapport du jour à 21h Paris et le range dans lv-data (onglet Coach). Aucun mail.
  schedule = "0 19,20 * * *"

[functions."report-preview"]
  # Porte HTTP du rapport (une fonction planifiée répond 403 en direct)
  included_files = ["node_modules/@resvg/resvg-js-linux-x64-gnu/**"]

[functions."report-send-background"]
  # Envoi manuel du vrai mail (arrière-plan, 15 min max)
  included_files = ["node_modules/@resvg/resvg-js-linux-x64-gnu/**"]

# [functions."weekly-recap"]
#   EN SOMMEIL (oct. 2026) — remplacé par daily-report. Code conservé, appel manuel toujours possible.
#   schedule = "0 17,18 * * 0"

[functions."daily-push"]
  schedule = "0 4,5 * * *"

# [functions."daily-session"]
#   EN SOMMEIL (oct. 2026) — mail « séance du jour » 4h retiré à la demande de Laurent.
#   (Il plantait depuis l'ajout de raceWin() dans trail-v2 : fonction non extraite par son moteur.)
#   schedule = "0 2,3 * * *"
