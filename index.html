<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Coach Nutrition Trail</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0d0f;--surf:#141416;--surf2:#1c1c20;--bdr:#2a2a30;--acc:#e8ff47;--acc2:#ff6b35;--warn:#ff9500;--txt:#f0f0f0;--mut:#6b6b78;--grn:#4ade80;--red:#f87171;--purp:#a78bfa}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
  .bb{font-family:'Bebas Neue',sans-serif}
  #header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:2px solid var(--acc)}
  #header-top{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start}
  #badge{font-size:10px;font-weight:600;padding:4px 8px;border-radius:4px;background:rgba(255,107,53,.15);color:var(--acc2);border:1px solid rgba(255,107,53,.3);white-space:nowrap}
  #tabs{display:flex;background:var(--surf);border-bottom:1px solid var(--bdr);overflow-x:auto;scrollbar-width:none}
  .tab-btn{flex:1;padding:11px 6px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;cursor:pointer;color:var(--mut);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap}
  .tab-btn.active{color:var(--acc);border-bottom-color:var(--acc)}
  #content{padding:12px 14px 80px}
  .tab-pane{display:none}.tab-pane.active{display:block}
  .card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:10px}
  .card.acc{border-color:rgba(232,255,71,.3)}
  .lbl{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--mut);margin-bottom:12px}
  .flbl{font-size:10px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block}
  .fg{margin-bottom:14px}
  .bg{display:flex;flex-wrap:wrap;gap:6px}
  .tbtn{padding:9px 12px;border:1.5px solid var(--bdr);background:var(--surf2);color:var(--mut);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer}
  .tbtn.on{border-color:var(--acc);background:rgba(232,255,71,.08);color:var(--acc);font-weight:600}
  .tbtn.on-o{border-color:var(--acc2);background:rgba(255,107,53,.08);color:var(--acc2);font-weight:600}
  .tbtn.on-g{border-color:var(--grn);background:rgba(74,222,128,.08);color:var(--grn);font-weight:600}
  .tbtn.on-w{border-color:var(--warn);background:rgba(255,149,0,.08);color:var(--warn);font-weight:600}
  .dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dbtn{padding:10px 4px;border:1.5px solid var(--bdr);background:var(--surf2);color:var(--mut);border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:16px;cursor:pointer;text-align:center}
  .dbtn.on{border-color:var(--acc);background:rgba(232,255,71,.08);color:var(--acc)}
  textarea{width:100%;background:var(--surf2);border:1px solid var(--bdr);border-radius:6px;padding:8px 10px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:12px;resize:none;outline:none;min-height:52px}
  .btn-p{width:100%;padding:16px;background:var(--acc);color:#000;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:8px}
  .btn-p:disabled{opacity:.4;cursor:not-allowed}
  .btn-c{width:100%;padding:12px;background:var(--surf2);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
  .errbox{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:12px 14px;color:var(--red);font-size:12px;margin-bottom:10px;line-height:1.5}
  #lov{display:none;position:fixed;inset:0;background:rgba(13,13,15,.92);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px}
  #lov.on{display:flex}
  .spin{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ltxt{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:var(--mut)}
  .dc{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .dh{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start}
  .dt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--txt)}
  .dtr{font-size:11px;color:var(--acc2);margin-top:2px}
  .db{display:none;border-top:1px solid var(--bdr)}
  .db.open{display:block}
  .ms{padding:10px 14px;border-bottom:1px solid var(--bdr)}
  .ms:last-child{border-bottom:none}
  .mh{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer}
  .mtype{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:2px;color:var(--acc);margin-bottom:2px}
  .mname{font-size:14px;font-weight:600;color:var(--txt)}
  .mmeta{font-size:11px;color:var(--mut);margin-top:2px}
  .mdet{display:none;margin-top:10px}
  .mdet.open{display:block}
  .mdesc{font-size:12px;color:#c8c8c8;line-height:1.6;margin-bottom:8px}
  .trow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .tag{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .tp{background:rgba(74,222,128,.1);color:var(--grn);border:1px solid rgba(74,222,128,.25)}
  .tpr{background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.25)}
  .tg{background:rgba(232,255,71,.08);color:var(--acc);border:1px solid rgba(232,255,71,.2)}
  .tr{background:rgba(255,107,53,.1);color:var(--acc2);border:1px solid rgba(255,107,53,.25)}
  .ta{background:rgba(167,139,250,.1);color:var(--purp);border:1px solid rgba(167,139,250,.25)}
  .tl{background:rgba(107,107,120,.15);color:var(--mut);border:1px solid rgba(107,107,120,.3)}
  .tt{background:rgba(255,149,0,.08);color:var(--warn);border:1px solid rgba(255,149,0,.25)}
  .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .mb{background:var(--surf2);border:1px solid var(--bdr);border-radius:6px;padding:7px 6px;text-align:center}
  .mv{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--acc)}
  .ml{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .mn{background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.2);border-radius:6px;padding:8px 10px;font-size:11px;color:#c8c8c8;line-height:1.6;margin-bottom:8px}
  .mn strong{color:var(--purp)}
  .sl{padding-left:16px}
  .sl li{font-size:12px;color:var(--mut);line-height:1.6;margin-bottom:3px}
  .ccat{margin-bottom:14px}
  .ccatl{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:2px;color:var(--acc);margin-bottom:6px}
  .ci{font-size:13px;color:var(--txt);padding:5px 0;border-bottom:1px solid var(--bdr)}
  .ji{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:12px 14px;margin-bottom:8px}
  .jd{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--acc);margin-bottom:4px}
  .jm{font-size:12px;color:#c8c8c8;line-height:1.7}
  .js{font-size:11px;color:var(--mut);margin-top:6px;font-style:italic}
  .jf{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .jmeta{font-size:10px;color:var(--mut)}
  .bdel{padding:5px 10px;background:none;border:1px solid rgba(248,113,113,.3);border-radius:5px;color:var(--red);font-size:11px;cursor:pointer}
  .empty{text-align:center;padding:40px 20px;color:var(--mut)}
  .empty-i{font-size:40px;margin-bottom:12px}
  .empty-t{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px}
  .sumcard{background:var(--surf);border:1px solid rgba(232,255,71,.3);border-radius:10px;padding:14px;margin-bottom:12px}
  .suml{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:var(--mut);margin-bottom:6px}
  .sumt{font-size:12px;color:#c8c8c8;line-height:1.7}
</style>
</head>
<body>
<div id="lov"><div class="spin"></div><div class="ltxt">Génération en cours...</div></div>

<div id="header">
  <div id="header-top">
    <div>
      <div class="bb" style="font-size:10px;letter-spacing:3px;color:var(--acc);margin-bottom:2px">Coach Nutrition Trail</div>
      <div class="bb" style="font-size:28px;letter-spacing:1px;line-height:1;color:var(--txt)">Plan Semaine</div>
    </div>
    <span id="badge">Nouveau plan</span>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="config">Config</button>
    <button class="tab-btn" data-tab="plan">Plan</button>
    <button class="tab-btn" data-tab="courses">Courses</button>
    <button class="tab-btn" data-tab="journal">Journal</button>
  </div>
</div>

<div id="content">
  <div class="tab-pane active" id="tab-config">
    <div class="card acc">
      <div class="lbl">Configuration</div>
      <div class="fg">
        <label class="flbl">Contexte Trail</label>
        <div class="bg" id="ctx-g">
          <button class="tbtn on-o" data-v="charge">Semaine chargée (&gt;50km)</button>
          <button class="tbtn" data-v="recup">Récup post-course</button>
          <button class="tbtn" data-v="normale">Semaine normale</button>
          <button class="tbtn" data-v="affutage">Affûtage J-7</button>
        </div>
      </div>
      <div class="fg">
        <label class="flbl">Nombre de jours</label>
        <div class="dgrid" id="day-g">
          <button class="dbtn" data-v="1">1</button>
          <button class="dbtn" data-v="2">2</button>
          <button class="dbtn on" data-v="3">3</button>
          <button class="dbtn" data-v="4">4</button>
          <button class="dbtn" data-v="5">5</button>
          <button class="dbtn" data-v="6">6</button>
          <button class="dbtn" data-v="7">7</button>
        </div>
      </div>
      <div class="fg">
        <label class="flbl">Format repas</label>
        <div class="bg" id="fmt-g">
          <button class="tbtn on" data-v="solo">Solo</button>
          <button class="tbtn" data-v="couple">Couple</button>
          <button class="tbtn" data-v="famille">Famille</button>
        </div>
      </div>
      <div class="fg">
        <label class="flbl">Ingrédients à utiliser / Exclusions</label>
        <textarea id="envies" placeholder="Ex: j'ai du poulet à finir (1 recette max), pas de riz cette semaine..."></textarea>
      </div>
      <div class="fg">
        <label class="flbl">Entraînements prévus</label>
        <textarea id="trainings" placeholder="Ex: sortie longue samedi 3h..."></textarea>
      </div>
    </div>
    <div id="err"></div>
    <button class="btn-p" id="gen-btn" onclick="gen()">Générer le plan semaine</button>
  </div>

  <div class="tab-pane" id="tab-plan">
    <div id="plan-c"><div class="empty"><div class="empty-i">🥗</div><div class="empty-t">Aucun plan généré</div></div></div>
  </div>

  <div class="tab-pane" id="tab-courses">
    <div id="courses-c"><div class="empty"><div class="empty-i">🛒</div><div class="empty-t">Liste vide</div></div></div>
  </div>

  <div class="tab-pane" id="tab-journal">
    <div class="card" style="margin-bottom:10px">
      <div class="lbl">Historique</div>
      <div style="font-size:12px;color:var(--mut)">Les recettes récentes sont injectées automatiquement pour éviter les répétitions.</div>
    </div>
    <div id="journal-c"><div class="empty"><div class="empty-i">📓</div><div class="empty-t">Journal vide</div></div></div>
  </div>
</div>

<script>
const HIST_KEY="nutrition:history:v2";
const CTX={
  charge:"semaine trail chargée >50km, priorité glucides et récupération",
  recup:"récupération post-course, priorité protéines et anti-inflammatoire",
  normale:"semaine trail normale, équilibre performance",
  affutage:"affûtage J-7 course, digestibilité maximale"
};
const FMT={solo:"1 personne",couple:"2 personnes",famille:"famille avec enfants"};
const TAGCLS={"post-effort":"tp","pre-effort":"tpr","charge-glucidique":"tg","récup-protéique":"tr","anti-inflammatoire":"ta","léger":"tl"};

let cfg={ctx:"charge",days:3,fmt:"solo"};
let plan=null,hist=[];

async function loadHist(){
  try{const h=await window.storage.get(HIST_KEY);if(h)hist=JSON.parse(h.value);}catch(e){}
  renderJournal();
}
async function saveHist(){try{await window.storage.set(HIST_KEY,JSON.stringify(hist));}catch(e){}}

// Tabs
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab-pane").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById("tab-"+b.dataset.tab).classList.add("active");
}));

// Config
document.querySelectorAll("#ctx-g .tbtn").forEach(b=>b.addEventListener("click",()=>{
  cfg.ctx=b.dataset.v;
  document.querySelectorAll("#ctx-g .tbtn").forEach(x=>x.className="tbtn");
  const cls={charge:"tbtn on-o",recup:"tbtn on-g",normale:"tbtn on",affutage:"tbtn on-w"};
  b.className=cls[cfg.ctx];
}));
document.querySelectorAll("#day-g .dbtn").forEach(b=>b.addEventListener("click",()=>{
  cfg.days=+b.dataset.v;
  document.querySelectorAll("#day-g .dbtn").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
}));
document.querySelectorAll("#fmt-g .tbtn").forEach(b=>b.addEventListener("click",()=>{
  cfg.fmt=b.dataset.v;
  document.querySelectorAll("#fmt-g .tbtn").forEach(x=>x.className="tbtn");
  b.className="tbtn on";
}));

function buildPrompt(){
  const recent=hist.slice(0,4).flatMap(p=>(p.days||[]).flatMap(d=>[d.lunch?.name,d.dinner?.name].filter(Boolean)));
  const envies=document.getElementById("envies").value;
  const trainings=document.getElementById("trainings").value;
  const ex=recent.length?" Ne pas répéter: "+recent.slice(0,6).join(", ")+".":"";
  const entr=trainings?" Entraînements prévus: "+trainings+".":"";
  const excl=envies?" Ingrédients à utiliser/exclusions (1 seule recette max par ingrédient à finir): "+envies+".":"";

  const modulations={
    charge:`Modulation semaine chargée : augmenter les glucides complexes (pâtes, riz, quinoa, patate douce) à 35-40% de l'assiette avant les sorties. Maintenir les protéines. Privilégier les anti-inflammatoires (oméga-3, curcuma, baies, gingembre).`,
    recup:`Modulation récupération : augmenter les protéines réparatrices (20-30g/repas minimum). Réduire légèrement les féculents. Maximiser les anti-inflammatoires et antioxydants (légumes colorés, baies, poisson gras, curcuma).`,
    normale:`Modulation semaine normale : respecter strictement l'équilibre de base. Varier les sources de protéines (viande/poisson/œufs/légumineuses en rotation). Diversifier les légumes.`,
    affutage:`Modulation affûtage J-7 : aliments digestibles uniquement — pas de légumineuses, pas de chou, pas d'aliments nouveaux. Féculents faciles (riz blanc, pâtes blanches). Protéines maigres. Légumes cuits uniquement.`
  };

  return `Coach neuro-nutrition trail. Génère un plan ${cfg.days} jours pour ${FMT[cfg.fmt]}.${excl}${entr}${ex}

BASE NUTRITIONNELLE OBLIGATOIRE (socle non négociable pour chaque repas) :
- Assiette : 1/4 protéines (viande/poisson/œufs/légumineuses), 1/4 féculents, 1/2 légumes et fruits
- 1 portion de bonnes graisses par repas (huile olive, avocat, oléagineux, poisson gras)
- Jamais de repas sans légumes — minimum 200g, variés et colorés
- Temps préparation <30 min

${modulations[cfg.ctx]}

JSON strict sans markdown :
{"context":"label","days":[{"dayLabel":"Jour 1","trainingNote":null,"lunch":{"name":"Nom recette","description":"description incluant légumes et équilibre","tags":["post-effort"],"prepTime":20,"macros":{"proteines":35,"glucides":50,"lipides":15},"microNote":"note micronutriments clés (magnésium, oméga-3, fer...)","steps":["1","2","3"]},"dinner":{"name":"Nom","description":"description","tags":["anti-inflammatoire"],"prepTime":20,"macros":{"proteines":40,"glucides":40,"lipides":18},"microNote":"note","steps":["1","2","3"]}}],"shoppingList":{"Protéines":["item"],"Féculents":["item"],"Légumes":["item"],"Fruits":["item"],"Graisses & oléagineux":["item"],"Condiments & divers":["item"]},"weekSummary":"1 phrase résumé logique nutritionnelle + adaptation contexte."}
Génère exactement ${cfg.days} jours. Tags: post-effort, pre-effort, charge-glucidique, récup-protéique, anti-inflammatoire, léger.`;
}
async function gen(){
  document.getElementById("err").innerHTML="";
  document.getElementById("lov").classList.add("on");
  document.getElementById("gen-btn").disabled=true;
  try{
    const resp=await fetch("/.netlify/functions/generate",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:4000,messages:[{role:"user",content:buildPrompt()}]})
    });
    const raw=await resp.text();
    let data;
    try{data=JSON.parse(raw);}
    catch(e){throw new Error("Réponse invalide ("+resp.status+"): "+raw.slice(0,200));}
    if(!resp.ok) throw new Error("HTTP "+resp.status+": "+(data.error?.message||raw.slice(0,200)));
    const txt=data.content.map(i=>i.text||"").join("");
    let p;
    try{
      let clean=txt.trim();
      // Extraire contenu entre balises ```
      const m=clean.match(/```(?:json)?\s*([\s\S]*?)```/);
      if(m) clean=m[1].trim();
      // Extraire entre { et dernière }
      const s=clean.indexOf("{"), e=clean.lastIndexOf("}");
      if(s!==-1 && e!==-1) clean=clean.slice(s,e+1);
      p=JSON.parse(clean);
    }
    catch(e){throw new Error("JSON invalide: "+txt.slice(0,300));}
    p.id=Date.now();p.generatedAt=new Date().toISOString();p.cfg={...cfg};
    plan=p;
    hist.unshift(p);if(hist.length>12)hist=hist.slice(0,12);
    await saveHist();
    document.getElementById("badge").textContent=p.context||"Prêt";
    renderPlan(p);renderCourses(p);renderJournal();
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(x=>x.classList.remove("active"));
    document.querySelector('[data-tab="plan"]').classList.add("active");
    document.getElementById("tab-plan").classList.add("active");
  }catch(e){
    document.getElementById("err").innerHTML=`<div class="errbox">${e.message}</div>`;
  }
  document.getElementById("lov").classList.remove("on");
  document.getElementById("gen-btn").disabled=false;
}

function tagH(tags){
  if(!tags?.length)return"";
  return tags.map(t=>`<span class="tag ${TAGCLS[t]||'tl'}">${t}</span>`).join("");
}

function mealH(meal,type,idx){
  if(!meal)return"";
  const id=`md-${type}-${idx}`;
  return`<div class="ms">
    <div class="mh" onclick="toggleM('${id}',this)">
      <div>
        <div class="mtype">${type}</div>
        <div class="mname">${meal.name}</div>
        <div class="mmeta">⏱ ${meal.prepTime||"?"}min${meal.macros?` · ${meal.macros.proteines}P/${meal.macros.glucides}G/${meal.macros.lipides}L`:""}</div>
      </div>
      <span style="color:var(--mut);font-size:12px;margin-top:4px">▼</span>
    </div>
    <div class="mdet" id="${id}">
      ${meal.description?`<div class="mdesc">${meal.description}</div>`:""}
      <div class="trow">${tagH(meal.tags)}<span class="tag tt">⏱ ${meal.prepTime||"?"}min</span></div>
      <div class="mg">
        <div class="mb"><div class="mv">${meal.macros?.proteines??"-"}g</div><div class="ml">Protéines</div></div>
        <div class="mb"><div class="mv">${meal.macros?.glucides??"-"}g</div><div class="ml">Glucides</div></div>
        <div class="mb"><div class="mv">${meal.macros?.lipides??"-"}g</div><div class="ml">Lipides</div></div>
      </div>
      ${meal.microNote?`<div class="mn"><strong>Micro :</strong> ${meal.microNote}</div>`:""}
      ${meal.steps?.length?`<ol class="sl">${meal.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`:""}
    </div>
  </div>`;
}

function toggleM(id,hdr){
  const d=document.getElementById(id);
  const o=d.classList.toggle("open");
  hdr.querySelector("span").textContent=o?"▲":"▼";
}
function toggleD(i){
  const b=document.getElementById("db-"+i);
  const c=document.getElementById("dc-"+i);
  const o=b.classList.toggle("open");
  c.textContent=o?"▲":"▼";
}

function renderPlan(p){
  if(!p?.days)return;
  let h="";
  if(p.weekSummary)h+=`<div class="sumcard"><div class="suml">Logique de la semaine</div><div class="sumt">${p.weekSummary}</div></div>`;
  p.days.forEach((d,i)=>{
    h+=`<div class="dc">
      <div class="dh" onclick="toggleD(${i})">
        <div>
          <div class="dt">${d.dayLabel||"Jour "+(i+1)}</div>
          ${d.trainingNote?`<div class="dtr">🏃 ${d.trainingNote}</div>`:""}
        </div>
        <span id="dc-${i}" style="color:var(--mut);font-size:13px">${i===0?"▲":"▼"}</span>
      </div>
      <div class="db ${i===0?"open":""}" id="db-${i}">
        ${mealH(d.lunch,"Déjeuner",i)}
        ${mealH(d.dinner,"Dîner",i)}
      </div>
    </div>`;
  });
  document.getElementById("plan-c").innerHTML=h;
}

function renderCourses(p){
  if(!p?.shoppingList)return;
  const total=Object.values(p.shoppingList).flat().length;
  let h=`<div class="card"><div class="lbl">Liste consolidée</div>
    <div style="font-size:11px;color:var(--mut);margin-bottom:12px">${total} articles · ${p.cfg?.days||"?"}j · ${p.cfg?.fmt||""}</div>`;
  Object.entries(p.shoppingList).forEach(([cat,items])=>{
    h+=`<div class="ccat"><div class="ccatl">${cat}</div>`;
    items.forEach(item=>h+=`<div class="ci">· ${item}</div>`);
    h+=`</div>`;
  });
  h+=`<button class="btn-c" id="cpbtn" onclick="copyC()">▤ Copier la liste</button></div>`;
  document.getElementById("courses-c").innerHTML=h;
}

function copyC(){
  if(!plan?.shoppingList)return;
  let t=`COURSES — ${(plan.context||"").toUpperCase()}\n${"─".repeat(32)}\n\n`;
  Object.entries(plan.shoppingList).forEach(([c,items])=>{t+=`${c.toUpperCase()}\n`;items.forEach(i=>t+=`  • ${i}\n`);t+="\n";});
  navigator.clipboard.writeText(t).then(()=>{
    const b=document.getElementById("cpbtn");
    if(b){b.textContent="Copié ✓";setTimeout(()=>b.textContent="▤ Copier la liste",2000);}
  }).catch(()=>{});
}

function renderJournal(){
  if(!hist.length)return;
  let h="";
  hist.forEach(e=>{
    const date=new Date(e.generatedAt).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    const meals=(e.days||[]).flatMap(d=>[d.lunch?.name,d.dinner?.name].filter(Boolean));
    h+=`<div class="ji">
      <div class="jd">${date} — ${e.context||""}</div>
      <div class="jm">${meals.join(" · ")}</div>
      ${e.weekSummary?`<div class="js">${e.weekSummary}</div>`:""}
      <div class="jf">
        <div class="jmeta">${e.cfg?.days||"?"}j · ${e.cfg?.fmt||""}</div>
        <button class="bdel" onclick="delE(${e.id})">Supprimer</button>
      </div>
    </div>`;
  });
  document.getElementById("journal-c").innerHTML=h;
}

async function delE(id){
  hist=hist.filter(e=>e.id!==id);
  await saveHist();renderJournal();
}

loadHist();
</script>
